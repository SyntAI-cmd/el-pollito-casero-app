name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · ruff + mypy + alembic + pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pollito
          POSTGRES_PASSWORD: pollito
          POSTGRES_DB: pollito
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pollito"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pollito:pollito@localhost:5432/pollito
      DATABASE_URL_TEST: postgresql+asyncpg://pollito:pollito@localhost:5432/pollito
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migraciones contra Postgres real y control de deriva del esquema
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q
      - name: Exportar OpenAPI
        run: uv run python -m scripts.exportar_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  app:
    name: App · cliente OpenAPI + tsc + eslint + jest
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api
      - run: npm ci
      - name: Generar cliente TS desde el OpenAPI
        run: npm run api:openapi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
