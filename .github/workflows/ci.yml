name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · ruff + mypy + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Exportar OpenAPI
        run: uv run python scripts/exportar_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  app:
    name: App · cliente OpenAPI + tsc + eslint + jest
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api
      - run: npm ci
      - name: Generar cliente TS desde el OpenAPI
        run: npm run api:openapi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
