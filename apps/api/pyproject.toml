[project]
name = "pollito-casero-api"
version = "0.1.0"
description = "API de Pollito Casero: pedidos, pesada, reparto y cuentas corrientes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.4",
    "redis>=5.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "tzdata>=2024.1",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "arq>=0.26",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
    "types-openpyxl>=3.1.5.20260827",
    "types-reportlab>=5.0.0.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # generado por autogenerate

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]

[tool.uv]
package = false

# sesion.scalar() devuelve Any para SQLAlchemy; los repositorios ya declaran el tipo de retorno.
[[tool.mypy.overrides]]
module = "app.modules.*.repository"
warn_return_any = false
