# Infraestructura local: Postgres 16 + Redis 7. La API y la app corren fuera de Docker en desarrollo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pollito
      POSTGRES_PASSWORD: pollito
      POSTGRES_DB: pollito
      TZ: America/Argentina/Mendoza
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollito -d pollito"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
